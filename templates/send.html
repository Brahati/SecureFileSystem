{% extends "base.html" %}

{% block content %}

<div class="page-header page-header-center">
    <div>
        <h2 class="page-title">Send File</h2>
        <p class="page-desc">Select a recipient, upload your file, and transmit through the encryption pipeline.</p>
    </div>
</div>

<div class="send-layout">
    <div class="card send-card">
        <form method="POST" enctype="multipart/form-data" class="send-form">

            <div class="form-group">
                <label for="receiver">Receiver</label>
                <div class="select-wrap">
                    <select name="receiver" id="receiver" required>
                        {% for username in usernames %}
                            {% if username != session['user'] %}
                                <option value="{{ username }}">{{ username|capitalize }}</option>
                            {% endif %}
                        {% endfor %}
                    </select>
                    <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
            </div>

            <div class="form-group">
                <label>File upload</label>
                <input type="file" name="file" id="fileInput" required>

                <div class="drop-zone" id="dropZone" role="button" tabindex="0" aria-label="Upload file">
                    <div class="drop-zone-inner">
                        <div class="file-icon-wrap" id="fileIcon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                        </div>
                        <p class="drop-title">Drag &amp; drop your file here</p>
                        <p class="drop-subtitle">or click to browse from your device</p>
                        <p class="file-preview-name" id="fileName">No file selected</p>
                        <p class="file-preview-status" id="fileStatus">Supports any file type</p>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Encrypt &amp; Send
            </button>
        </form>
    </div>
</div>

{% endblock %}
