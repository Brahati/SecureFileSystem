<!DOCTYPE html>
<html>
<head>
    <title>SecureShare</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <h2>🔐 SecureShare</h2>
    {% if session.get('user') %}
        <div>
            <span>{{ session['user'] }}</span>
            <a href="/logout" style="color:white; margin-left:15px;">Logout</a>
        </div>
    {% endif %}
</div>

<!-- MAIN CONTENT -->
{% if session.get('user') %}
<div class="main">
    <div class="sidebar">
        <h3>Encryption Hub</h3>
        <button onclick="window.location.href='/send'">Send File</button>
        <button onclick="window.location.href='/receive'">Received Files</button>
    </div>
    <div class="content">
{% endif %}

    {% block content %}{% endblock %}

{% if session.get('user') %}
    </div>
</div>
{% endif %}


</body>
</html>
